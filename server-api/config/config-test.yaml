# 应用基础信息。env 决定加载 config-{env}.yaml；mode 决定本进程启用的 HTTP 服务。
app:
  # 服务名称，仅用于日志、文档等标识。
  name: xserver
  # 当前环境标识：dev（开发）、test（测试）或 prod（生产）。
  env: test
  # 是否启用调试行为；生产环境应关闭，避免输出敏感调试信息。
  debug: true
  # 应用版本号，可用于发布标识。
  version: 1.0.0
  # 文件访问的公共基础地址；不配置时由业务接口自行返回相对路径或完整地址。
  file_url: ""
  # 服务运行模式，用于选择部署拓扑：mixed 适合简单项目的单体部署，同时提供全部接口；
  # 当前台 API 与管理后台 API 需要分别部署、独立扩缩容时，分别以 api 和 admin_api 模式启动对应服务。
  mode: mixed

# 各运行模式对应的监听端口；实际使用哪个端口由 app.mode 决定。
servers:
  mixed:
    # mixed 模式的 HTTP 端口。
    port: 8800
  api:
    # api 模式的 HTTP 端口。
    port: 8801
  admin_api:
    # admin_api 模式的 HTTP 端口。
    port: 8802

# Redis 连接配置，用于缓存、验证码等依赖 Redis 的功能。
redis:
  # Redis 服务地址，格式为 主机:端口。
  addr: 127.0.0.1:6379
  # Redis 认证密码；未启用认证时留空。
  password: ''
  # Redis 键名前缀；多个环境共用 Redis 时应设置不同前缀。
  prefix: ''
# MySQL 数据库连接配置。
database:
  # 数据库驱动名称；当前项目使用 mysql。
  driver: mysql
  # 数据库连接串；应替换账号、密码、地址和库名，生产环境不要提交真实凭据。
  dsn: root:123456@tcp(127.0.0.1)/go_app_starter_test?charset=utf8&parseTime=True&loc=Local
  # 是否跳过 GORM 单条写操作的默认事务；开启前需确认多步骤写入已显式使用事务。
  skip_default_transaction: true
  # 空闲连接池保留的最大连接数。
  max_idle_conns: 10
  # 数据库连接池允许建立的最大连接数。
  max_open_conns: 50
# JWT 登录令牌配置。
jwt:
  # JWT 签名密钥；生产环境必须替换为足够长的随机值并妥善保管。
  secret: 1234435435345345345
  # 登录令牌有效期，单位为秒；86400 表示 24 小时。
  expire_seconds: 86400
admin:
  # 管理后台功能与安全策略。
  # 是否在后台页面展示当前登录管理员的追溯水印。开启后水印内容为“昵称（登录账号）”，便于从截图或泄露图片定位来源。
  # 修改配置后需重启后端，管理员重新登录后生效。
  watermark: false
  # 是否按角色层级严格限制角色管理权限。
  # false：保持兼容模式，管理员可管理顶级角色；true：只能操作自身及下级角色，新建角色默认归属当前角色。
  use-strict-auth: false
  totp:
    # 是否启用 Google Authenticator 等兼容应用的 TOTP 双因素认证。
    # 开启后，仅已完成绑定的后台用户登录时必须提供动态验证码；已有用户需要在个人设置中完成绑定。
    enable: false
    # TOTP 在认证器中显示的签发方名称；建议填写系统或组织名称，留空时服务端默认使用 xadmin。
    issuer: xadmin
  captcha:
    # 后台登录图形验证码开关。开启后登录接口必须提交 captcha 与 captchaId，用于降低密码暴力尝试风险。
    # 自动化测试默认关闭，避免测试依赖随机验证码内容。
    enable: false

pprof:
  # 是否启用 pprof；仅在开发或临时排障时开启。
  enable: false
  # pprof 监听端口，实际监听地址固定为 127.0.0.1:port。
  port: 6060

# Swagger/OpenAPI 文档生成配置。
api-doc:
  # 是否启用接口文档服务与生成能力；生产环境通常关闭。
  enable: true
  # 兼容旧版的默认 Swagger 输出文件路径。
  output-swagger-file: static/swagger/api/swagger.json
  # 前台 API 的 Swagger 输出文件路径。
  api-output-swagger-file: static/swagger/api/swagger.json
  # 管理后台 API 的 Swagger 输出文件路径。
  admin-output-swagger-file: static/swagger/admin-api/swagger.json
  # 系统管理 API 的 Swagger 输出文件路径。
  system-output-swagger-file: static/swagger/system/swagger.json
  # 生成文档时扫描的 Go 包目录；接口未出现在文档中时，请确认其所在包已列入此处。
  gen-scan-dir:
    - "pkg/context/api"
    - "internal/api"
    - "internal/system"
    - "internal/admin-api"
